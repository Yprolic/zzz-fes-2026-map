    // ========= 工具：生成官图精确几何多边形 =========
    function rectPoly(x, y, w, d) {
      return [[x, y], [x + w, y], [x + w, y + d], [x, y + d]];
    }
    function chamferRect(x, y, w, d, cTL, cTR, cBR, cBL) {
      return [
        [x + cTL, y], [x + w - cTR, y],
        [x + w, y + cTR], [x + w, y + d - cBR],
        [x + w - cBR, y + d], [x + cBL, y + d],
        [x, y + d - cBL], [x, y + cTL]
      ];
    }
    function circlePoly(cx, cy, r, segs = 28) {
      const pts = [];
      for (let i = 0; i < segs; i++) {
        const a = (i / segs) * Math.PI * 2;
        pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]);
      }
      return pts;
    }
    // 官图「布连邦雕像 + 算枢中心」右凸圆弧复合体块
    function statueComplexPoly() {
      const pts = [
        [758, 174], [912, 174], [912, 224]
      ];
      // 右侧半圆弧凸起
      for (let i = -4; i <= 4; i++) {
        const a = (i / 4) * (Math.PI / 2);
        pts.push([912 + Math.cos(a) * 62, 294 + Math.sin(a) * 70]);
      }
      pts.push([912, 364], [912, 412], [758, 412]);
      return pts;
    }
    function rotatePoly(pts, cx, cy, deg) {
      const rad = deg * Math.PI / 180;
      const cos = Math.cos(rad), sin = Math.sin(rad);
      return pts.map(([x, y]) => [
        cx + (x - cx) * cos - (y - cy) * sin,
        cy + (x - cx) * sin + (y - cy) * cos
      ]);
    }

    function getWorldCenter() {

    function project(wx, wy, wz = 0) {
      const c = getWorldCenter();
      const cx = canvas.clientWidth / 2 + view.x;
      const cy = canvas.clientHeight / 2 + view.y;

      }
      const isoX = (rx - ry) * 0.866;
      const isoY = (rx + ry) * 0.45 - wz * 1.15;
      return { x: cx + isoX * view.scale, y: cy + isoY * view.scale };
    }

    function polyCentroid(pts) {
      let sx = 0, sy = 0;
      for (const [x, y] of pts) { sx += x; sy += y; }

    function drawPoly(pts, fill, stroke, lw = 1) {
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);

      if (fill) { ctx.fillStyle = fill; ctx.fill(); }
      if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
    }

    // 通用任意多边形 3D 建筑灰模挤出函数（支持八边形、圆形、圆弧复合体、旋转矩形）
    function drawPrism(worldPts, h, colors, options = {}) {
      const bot = worldPts.map(([x, y]) => project(x, y, 0));
      const [cx, cy] = polyCentroid(worldPts);

      if (mode === "2d") {
        if (options.shadow) {
          drawPoly(bot.map(p => ({ x: p.x + 2, y: p.y + 3 })), colors.shadow);
        }
        drawPoly(bot, colors.top, colors.stroke, options.strokeWidth || 1.2);
        return { topCenter: project(cx, cy, 0), hitPoly: bot };
      }

      const top = worldPts.map(([x, y]) => project(x, y, h));

      // 地面建筑斜影
      if (options.shadow) {
        const sh = h * 0.42;
        const shPts = worldPts.map(([x, y]) => project(x + sh, y + sh * 0.55, 0));
        drawPoly(shPts, colors.shadow);
      }

      // 仅绘制朝向摄像机（东南方向：法线 nx + ny > 0）的侧面
      for (let i = 0; i < worldPts.length; i++) {
        const j = (i + 1) % worldPts.length;
        const [x1, y1] = worldPts[i], [x2, y2] = worldPts[j];
        const dx = x2 - x1, dy = y2 - y1;
        // 顺时针多边形外法线为 (dy, -dx)
        const nx = dy, ny = -dx;
        if (nx + ny > 0) {
          const shade = nx > ny ? colors.right : colors.left;
          drawPoly([bot[i], bot[j], top[j], top[i]], shade, colors.stroke, 0.7);
        }
      }

      // 顶面
      drawPoly(top, colors.top, colors.stroke, options.strokeWidth || 1.1);
      return { topCenter: project(cx, cy, h), hitPoly: top };
    }

    function drawPin(sx, sy, color = "#ec4899") {
      ctx.save();

      ctx.beginPath();
      ctx.ellipse(0, 6, 7, 3.5, 0, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(0,0,0,0.34)";
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(0, 5);
      ctx.bezierCurveTo(-13, -8, -14, -24, 0, -24);
      ctx.bezierCurveTo(14, -24, 13, -8, 0, 5);
      ctx.closePath();
      ctx.fillStyle = color;
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = "#ffffff";
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(0, -13, 4.5, 0, Math.PI * 2);
      ctx.fillStyle = "#ffffff";
      ctx.fill();
      ctx.restore();
    }

      if (currentHall === "h4") {
        drawPoly(rectPoly(24, 188, 228, 420).map(([x, y]) => project(x, y, mode === "3d" ? 10.5 : 0)), pal.pad, pal.stroke, 1);
        // 中心圆形广场外环装饰线
        const ring = circlePoly(630, 310, 92, 32).map(([x, y]) => project(x, y, mode === "3d" ? 10.4 : 0));
        drawPoly(ring, null, pal.stroke, 1.2);
      }

      // 东侧入口标注
      const ent = project(1086, 312, mode === "3d" ? 12 : 0);
      ctx.fillStyle = "#eab308";
      ctx.font = `800 ${Math.max(11, Math.round(13 * view.scale))}px system-ui, sans-serif`;
      ctx.textAlign = "center";
      ctx.fillText(entranceText, ent.x, ent.y);

      const sorted = [...zones].sort((a, b) => {
        const [ax, ay] = polyCentroid(a.poly), [bx, by] = polyCentroid(b.poly);
        return (ax + ay) - (bx + by);
      });

      let selectedPinPos = null;

      for (const item of sorted) {
        const vis = matchesFilter(item);
        const isSel = selectedId === item.id;
        const isHov = hoveredId === item.id;
        const isStar = starred.has(item.id);
        const accent = tierAccent(item.tier);
        const isOff = item.kind === "official";

        ctx.save();
        if (!vis) ctx.globalAlpha = 0.2;

        const topFill = isSel
          ? (accent || "#3b82f6")
          : isHov
            ? pal.wallTop
            : isOff
              ? pal.officialTop
              : pal.boothTop;

        const res = drawPrism(item.poly, item.h, {
          top: topFill,
          left: isOff ? pal.officialLeft : pal.boothLeft,
          right: isOff ? pal.officialRight : pal.boothRight,
          stroke: isSel ? "#ffffff" : (accent || pal.stroke),
          shadow: pal.shadow
        }, { shadow: true, strokeWidth: isSel ? 2.2 : (accent ? 1.8 : 0.9) });

        // 游乐岛内部中庭细节 & 艾玫尔中央公园中心圆环细节
        if (item.id === "OFF_PARK") {
          const inner = circlePoly(630, 310, 26, 20).map(([x, y]) => project(x, y, mode === "3d" ? item.h + 0.8 : 0));
          drawPoly(inner, pal.slabTop, accent, 1.5);
        }

        ctx.textAlign = "center";
        if (item.kind !== "doujin") {
          const fs = Math.max(10, Math.round(13 * view.scale));
          ctx.fillStyle = isSel ? "#ffffff" : pal.text;
          ctx.font = `800 ${fs}px system-ui, sans-serif`;
          ctx.fillText(`${item.name.split("（")[0]}${isStar ? " ★" : ""}`, res.topCenter.x, res.topCenter.y + 3);
        } else {
          // 同人摊：整齐灰模 + 热度小圆点 + 摊位号
          const fs = Math.max(8, Math.round(9.5 * view.scale));
          ctx.fillStyle = isSel ? "#ffffff" : pal.text;
          ctx.font = `800 ${fs}px ui-monospace, monospace`;
          ctx.fillText(`${item.id}${isStar ? "★" : ""}`, res.topCenter.x, res.topCenter.y + (view.scale > 1.05 ? -1 : 3));
          if (view.scale > 1.05) {
            ctx.fillStyle = isSel ? "rgba(255,255,255,0.9)" : pal.subText;
            ctx.font = `500 ${Math.max(8, Math.round(8.2 * view.scale))}px system-ui, sans-serif`;
            const sn = item.name.length > 4 ? item.name.slice(0, 4) + "…" : item.name;
            ctx.fillText(sn, res.topCenter.x, res.topCenter.y + fs);
          }
          // 特定日出摊小角标（仅限非三日全勤的摊位，例如 days: ["D1","D2"]）
          if (item.days && item.days.length && item.days.length < 3 && view.scale > 0.72) {
            const [cx, cy] = polyCentroid(item.poly);
            const bp = project(cx - 14, cy - 12, mode === "3d" ? item.h + 1 : 0);
            const lbl = item.days.join("/");
            ctx.font = `700 ${Math.max(7, Math.round(7.5 * view.scale))}px ui-monospace, monospace`;
            const tw = ctx.measureText(lbl).width + 6;
            const th = Math.max(10, Math.round(10 * view.scale));
            ctx.fillStyle = "rgba(15, 23, 42, 0.85)";
            ctx.fillRect(bp.x - tw / 2, bp.y - th / 2, tw, th);
            ctx.fillStyle = "#f8fafc";
            ctx.fillText(lbl, bp.x, bp.y + th * 0.3);
          }
          // 热度颜色圆点（清晰直观，不再用柱高区分）
          if (accent && !isSel) {
            const [cx, cy] = polyCentroid(item.poly);
            const dp = project(cx + 15, cy - 11, mode === "3d" ? item.h + 0.8 : 0);
            ctx.beginPath();
            ctx.arc(dp.x, dp.y, Math.max(2.6, 3.2 * view.scale), 0, Math.PI * 2);
            ctx.fillStyle = accent;
            ctx.fill();
          }
        }

        ctx.restore();
        hitTargets.push({ item, poly: res.hitPoly });
        if (isSel) selectedPinPos = res.topCenter;
      }

      if (selectedPinPos) {
        drawPin(selectedPinPos.x, selectedPinPos.y - 6, "#ec4899");
      }
    }

    function draw() {
      needsDraw = false;
      const dpr = window.devicePixelRatio || 1;
      const cw = canvas.clientWidth;
      const ch = canvas.clientHeight;
      if (canvas.width !== Math.round(cw * dpr) || canvas.height !== Math.round(ch * dpr)) {
        canvas.width = Math.round(cw * dpr);
        canvas.height = Math.round(ch * dpr);
      }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      const pal = getPalette();
      ctx.fillStyle = pal.bg;
      ctx.fillRect(0, 0, cw, ch);

      hitTargets = [];
      if (currentHall === "overview") {
        drawOverview(pal);
      } else if (currentHall === "h4") {
        drawHallInterior(pal, [...HALL4_ZONES, ...DOUJIN_BOOTHS], "4号馆", "◀ 4号馆入口");
      } else if (currentHall === "h5") {
        drawHallInterior(pal, HALL5_ZONES, "5号馆", "◀ 5号馆入口");
      } else if (currentHall === "h6") {
        drawHallInterior(pal, HALL6_ZONES, "6号馆", "◀ 6号馆入口");
      }
    }

    function requestDraw() {
      if (!needsDraw) {
        needsDraw = true;
        requestAnimationFrame(draw);
      }
    }

    function pointInPoly(px, py, poly) {
      let inside = false;
      for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
        const xi = poly[i].x, yi = poly[i].y;
        const xj = poly[j].x, yj = poly[j].y;
        const intersect = ((yi > py) !== (yj > py)) && (px < (xj - xi) * (py - yi) / (yj - yi) + xi);
        if (intersect) inside = !inside;
      }
      return inside;
    }

    function hitTest(mx, my) {
      for (let i = hitTargets.length - 1; i >= 0; i--) {
        if (pointInPoly(mx, my, hitTargets[i].poly)) return hitTargets[i];
      }
      return null;
    }

    function switchHall(h) {

          : "hall-tab px-2.5 py-1 rounded-full text-[var(--muted-foreground)] cursor-pointer";
      });
      if (h === "overview") closeSheet();
      resetView();
    }

      const badgeLabel = b.tier === "OFF" ? "官方核心区"

      document.getElementById("sheetContent").innerHTML = `
        <div class="p-4 border-b border-[var(--border)] flex items-start justify-between gap-3 shrink-0">

              ${b.kind === "doujin" ? `<span class="px-2 py-0.5 rounded-full bg-[var(--content)] border border-[var(--border)] font-mono font-bold">展位 ${b.id}</span>` : ""}
              ${daysBadge}

            </div>

          </div>

            </div>
            <div>
              <div class="text-xs text-[var(--muted-foreground)] mb-1">区域/摊位说明</div>
              <p class="text-sm leading-relaxed">${b.desc}</p>
            </div>
            <div class="p-3.5 rounded-xl bg-[var(--content)] border-l-4 border-[var(--primary)]">
              <div class="text-xs font-bold text-[var(--primary)] mb-1">逛展提示</div>
              <p class="text-xs leading-relaxed">${b.d3Note}</p>
            </div>
          </div>

        <div class="p-4 border-t border-[var(--border)] flex items-center gap-2.5 shrink-0">
          <button onclick="toggleStar('${b.id}')" class="flex-1 py-2.5 rounded-xl text-sm font-semibold cursor-pointer transition-colors ${isStar ? 'bg-[var(--success)] text-white' : 'bg-[var(--primary)] text-[var(--primary-foreground)] hover:opacity-90'}">
            ${isStar ? '★ 已收藏至我的清单' : '☆ 收藏到我的清单'}
          </button>

        </div>

      if (gBox && imgs.length > 1) {

        gBox.addEventListener("touchstart", e => {
          if (e.touches.length === 1) { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }
        }, { passive: true });
        gBox.addEventListener("touchend", e => {
          if (e.changedTouches.length === 1) {
            const dx = e.changedTouches[0].clientX - sx;
            const dy = e.changedTouches[0].clientY - sy;
            if (Math.abs(dx) > 42 && Math.abs(dx) > Math.abs(dy) * 1.2) {
              setSidebarImg(currentGalleryIdx + (dx < 0 ? 1 : -1));
            }
          }
        }, { passive: true });
      }

      sidebar.classList.remove("sidebar-closed");
      sidebar.classList.add("sidebar-open");
      if (window.innerWidth >= 768) {
        controls.style.right = "456px";
        topBar.style.right = "452px";
      } else if (window.innerWidth >= 640) {
        controls.style.right = "416px";
        topBar.style.right = "412px";

    function closeSheet() {
      selectedId = null;
      renderSheet();
      requestDraw();
    }

    function toggleStar(id) {
      if (starred.has(id)) starred.delete(id);
      else starred.add(id);
      localStorage.setItem("zzz_fes_plan_v4", JSON.stringify([...starred]));
      updateFavBadge();
      renderSheet();
      requestDraw();
    }

    function updateFavBadge() {
      document.getElementById("favCountBadge").textContent = starred.size;

    function toggleMode() {
      mode = mode === "3d" ? "2d" : "3d";
      document.getElementById("btnMode").textContent = mode === "3d" ? "3D" : "2D";
      resetView();
    }

    function resetView() {
      const cw = canvas.clientWidth;
      const ch = canvas.clientHeight;
      if (currentHall === "overview") {
        view.scale = Math.min(cw / 1200, ch / 820, 0.92);
        view.x = -30;
        view.y = 30;
      } else if (mode === "3d") {
        view.scale = Math.min(cw / 1450, ch / 780, 0.86);
        view.x = 0;
        view.y = 25;
      } else {
        view.scale = Math.min(cw / 1260, ch / 760, 0.92);
        view.x = 0;
        view.y = 30;
      }
      requestDraw();
    }

    function focusDoujinZone() {
      if (currentHall !== "h4") switchHall("h4");
      const c = getWorldCenter();
      const wx = 138, wy = 398;
      view.scale = mode === "3d" ? 1.48 : 1.42;
      const rx = wx - c.x, ry = wy - c.y;
      const shift = selectedId && window.innerWidth >= 768 ? -200 : 0;
      if (mode === "2d") {
        view.x = -rx * view.scale + shift;
        view.y = -ry * view.scale;
      } else {
        view.x = -(rx - ry) * 0.866 * view.scale + shift;
        view.y = -(rx + ry) * 0.45 * view.scale;
      }
      requestDraw();
    }

    function focusItem(id) {
      const item = ALL_CLICKABLES.find(x => x.id === id);
      if (!item) return;
      if (id.startsWith("H5_")) switchHall("h5");
      else if (id.startsWith("H6_")) switchHall("h6");
      else if (currentHall !== "h4") switchHall("h4");

      selectedId = id;
      const c = getWorldCenter();
      const [wx, wy] = polyCentroid(item.poly);
      view.scale = item.kind === "doujin" ? 1.5 : 0.92;
      const rx = wx - c.x, ry = wy - c.y;
      const shift = window.innerWidth >= 768 ? -210 : 0;
      if (mode === "2d") {
        view.x = -rx * view.scale + shift;
        view.y = -ry * view.scale;
      } else {
        view.x = -(rx - ry) * 0.866 * view.scale + shift;
        view.y = -(rx + ry) * 0.45 * view.scale;
      }
      renderSheet();
      requestDraw();
    }

    function zoomCenter(factor) {
      view.scale = Math.max(0.35, Math.min(2.8, view.scale * factor));
      requestDraw();
    }

    let posterWallOpen = false;

        ...ALL_CLICKABLES.filter(b => b.gallery && b.gallery.length > 0 && b.kind !== "official").sort((a, b) => b.likes - a.likes).map(b => ({
          id: b.id, label: b.id === "OFF_PARTNER" ? "异业/雅迪" : b.id, name: b.name, artists: b.artists, poster: b.gallery[0], likes: b.likes, cnt: b.gallery.length

    function openLightbox(src, title) {

    function openGalleryLightbox(id, startIdx = 0) {
      const b = ALL_CLICKABLES.find(x => x.id === id);
      if (!b || !b.gallery.length) return;
      lbList = b.gallery;
      lbIdx = startIdx;
      lbTitle = `${b.id === "OFF_PARTNER" ? "异业合作" : b.id} · ${b.name}`;

    let lbZoomed = false;

    function applyLightboxZoom() {
      const img = document.getElementById("lightboxImg");
      const btn = document.getElementById("lbZoomBtn");
      if (lbZoomed) {
        img.className = "w-auto max-w-none h-auto rounded-lg shadow-2xl cursor-zoom-out";
        btn.textContent = "🔍 适应宽度";
      } else {
        img.className = "w-full max-w-[960px] h-auto rounded-lg shadow-2xl cursor-zoom-in";
        btn.textContent = "🔍 原尺寸";
      }
    }

    function toggleLightboxZoom() {
      lbZoomed = !lbZoomed;
      applyLightboxZoom();
    }

    function renderLightbox() {
      lbZoomed = false;
      applyLightboxZoom();
      document.getElementById("lightboxImg").src = lbList[lbIdx];
      document.getElementById("lightboxTitle").textContent = lbTitle;
      document.getElementById("lightboxCounter").textContent = lbList.length > 1 ? `(${lbIdx + 1} / ${lbList.length})` : "";
      document.getElementById("lbPrev").classList.toggle("hidden", lbList.length <= 1);
      document.getElementById("lbNext").classList.toggle("hidden", lbList.length <= 1);
      document.getElementById("lbScroll").scrollTop = 0;
      const lb = document.getElementById("lightbox");
      lb.classList.remove("hidden");
      lb.classList.add("flex");
    }

    function stepLightbox(delta) {
      if (lbList.length <= 1) return;
      lbIdx = (lbIdx + delta + lbList.length) % lbList.length;
      renderLightbox();
    }

    function closeLightbox() {
      const lb = document.getElementById("lightbox");
      lb.classList.add("hidden");
      lb.classList.remove("flex");
    }

    window.addEventListener("keydown", e => {
      const lb = document.getElementById("lightbox");
      if (lb.classList.contains("hidden")) return;
      if (e.key === "ArrowLeft") stepLightbox(-1);
      else if (e.key === "ArrowRight") stepLightbox(1);
      else if (e.key === "Escape") closeLightbox();
    });

    // 交互：支持桌面拖拽/滚轮 + 移动端单指丝滑拖拽 & 双指捏合缩放（以两指中心缩放）
    const activePointers = new Map();
    let dragging = false, moved = false, startX = 0, startY = 0, origX = 0, origY = 0;
    let pinchStartDist = 0, pinchStartScale = 1, pinchMidX = 0, pinchMidY = 0, pinchOrigX = 0, pinchOrigY = 0;

    function getPinchInfo() {
      const pts = [...activePointers.values()];
      const dx = pts[1].x - pts[0].x;
      const dy = pts[1].y - pts[0].y;
      return {
        dist: Math.hypot(dx, dy) || 1,
        midX: (pts[0].x + pts[1].x) / 2,
        midY: (pts[0].y + pts[1].y) / 2
      };
    }

    canvas.addEventListener("pointerdown", e => {
      canvas.setPointerCapture?.(e.pointerId);
      activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

      if (activePointers.size === 1) {
        dragging = true; moved = false;
        startX = e.clientX; startY = e.clientY;
        origX = view.x; origY = view.y;
      } else if (activePointers.size === 2) {
        moved = true;
        dragging = false;
        const p = getPinchInfo();
        pinchStartDist = p.dist;
        pinchStartScale = view.scale;
        pinchMidX = p.midX;
        pinchMidY = p.midY;
        pinchOrigX = view.x;
        pinchOrigY = view.y;
      }
    });

    canvas.addEventListener("pointermove", e => {
      const rect = canvas.getBoundingClientRect();
      const mx = e.clientX - rect.left, my = e.clientY - rect.top;

      if (activePointers.has(e.pointerId)) {
        activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      }

      if (activePointers.size === 2) {
        const p = getPinchInfo();
        const factor = p.dist / pinchStartDist;
        const nextScale = Math.max(0.32, Math.min(3.2, pinchStartScale * factor));
        const ratio = nextScale / pinchStartScale;
        const relMidX = pinchMidX - rect.left - rect.width / 2;
        const relMidY = pinchMidY - rect.top - rect.height / 2;
        const panDx = p.midX - pinchMidX;
        const panDy = p.midY - pinchMidY;
        view.scale = nextScale;
        view.x = relMidX - (relMidX - pinchOrigX) * ratio + panDx;
        view.y = relMidY - (relMidY - pinchOrigY) * ratio + panDy;
        requestDraw();
        return;
      }

      if (dragging && activePointers.size === 1) {
        const dx = e.clientX - startX, dy = e.clientY - startY;
        if (Math.abs(dx) > 5 || Math.abs(dy) > 5) moved = true;
        view.x = origX + dx; view.y = origY + dy;
        requestDraw();
        return;
      }

      if (e.pointerType === "mouse") {
        const hit = hitTest(mx, my);
        const newHov = hit ? (hit.item ? hit.item.id : hit.id) : null;
        if (newHov !== hoveredId) {
          hoveredId = newHov;
          canvas.style.cursor = hoveredId ? "pointer" : "grab";
          requestDraw();
        }
      }
    });

    function onPointerEnd(e) {
      const wasSingle = activePointers.size === 1 && dragging;
      activePointers.delete(e.pointerId);

      if (activePointers.size === 1) {
        // 从双指松开一根手指，平滑切回单指拖拽不跳变
        const rem = [...activePointers.values()][0];
        dragging = true;
        moved = true;
        startX = rem.x; startY = rem.y;
        origX = view.x; origY = view.y;
        return;
      }

      dragging = false;
      if (wasSingle && !moved) {
        const rect = canvas.getBoundingClientRect();
        const hit = hitTest(e.clientX - rect.left, e.clientY - rect.top);
        if (hit) {
          if (hit.overviewTarget) {
            switchHall(hit.overviewTarget);
          } else if (hit.item) {
            selectedId = hit.item.id;
            renderSheet();
            requestDraw();
          }
        } else {
          closeSheet();
        }
      }
    }

    canvas.addEventListener("pointerup", onPointerEnd);
    canvas.addEventListener("pointercancel", onPointerEnd);

    // 灯箱移动端左右滑动翻页
    const lbScrollEl = document.getElementById("lbScroll");
    let lbTouchX = 0, lbTouchY = 0;
    lbScrollEl.addEventListener("touchstart", e => {
      if (e.touches.length === 1) { lbTouchX = e.touches[0].clientX; lbTouchY = e.touches[0].clientY; }
    }, { passive: true });
    lbScrollEl.addEventListener("touchend", e => {
      if (!lbZoomed && lbList.length > 1 && e.changedTouches.length === 1) {
        const dx = e.changedTouches[0].clientX - lbTouchX;
        const dy = e.changedTouches[0].clientY - lbTouchY;
        if (Math.abs(dx) > 48 && Math.abs(dx) > Math.abs(dy) * 1.4) {
          stepLightbox(dx < 0 ? 1 : -1);
        }
      }
    }, { passive: true });

    canvas.addEventListener("wheel", e => {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const mx = e.clientX - rect.left - rect.width / 2;
      const my = e.clientY - rect.top - rect.height / 2;
      const factor = e.deltaY < 0 ? 1.12 : 0.89;
      const nextScale = Math.max(0.35, Math.min(2.8, view.scale * factor));
      const ratio = nextScale / view.scale;
      view.x = mx - (mx - view.x) * ratio;
      view.y = my - (my - view.y) * ratio;
      view.scale = nextScale;
      requestDraw();
    }, { passive: false });

    document.querySelectorAll(".hall-tab").forEach(btn => {
      btn.addEventListener("click", () => switchHall(btn.dataset.hall));
    });

    const searchInput = document.getElementById("searchInput");
    searchInput.addEventListener("input", e => {
      searchQuery = e.target.value;
      document.getElementById("btnClearSearch").classList.toggle("hidden", !searchQuery);
      requestDraw();
    });
    function clearSearch() {
      searchQuery = ""; searchInput.value = "";
      document.getElementById("btnClearSearch").classList.add("hidden");
      requestDraw();
    }

    document.querySelectorAll(".filter-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        activeFilter = btn.dataset.filter;
        document.querySelectorAll(".filter-btn").forEach(b => {
          b.className = b === btn
            ? "filter-btn px-2.5 py-1 rounded-full bg-[var(--primary)] text-[var(--primary-foreground)] font-medium shadow-sm cursor-pointer"
            : "filter-btn px-2.5 py-1 rounded-full bg-[var(--card)]/92 border border-[var(--border)] text-[var(--foreground)] shadow-sm cursor-pointer";
        });
        requestDraw();
      });
    });

    function syncStageHeight() {
      const stage = document.getElementById("mapStage");
      if (window.innerHeight >= 500) stage.style.height = window.innerHeight + "px";
      requestDraw();
    }
    window.addEventListener("resize", () => { syncStageHeight(); resetView(); });
    window.addEventListener("themechange", requestDraw);

    function ensureThemeTokens() {
      const cs = getComputedStyle(document.documentElement);
      if (!cs.getPropertyValue("--card").trim()) {
        const fallback = {
          "--background": "#12161d", "--content": "#1b2230", "--card": "#1e2533",
          "--border": "#334155", "--foreground": "#f1f5f9", "--muted-foreground": "#94a3b8",
          "--placeholder": "#64748b", "--primary": "#3b82f6", "--primary-foreground": "#ffffff",
          "--success": "#10b981", "--warning": "#f59e0b", "--error": "#ef4444"
        };
        for (const [k, v] of Object.entries(fallback)) document.body.style.setProperty(k, v);
      }
    }

    ensureThemeTokens();
    syncStageHeight();
    updateFavBadge();
    buildPosterWall();
    resetView();
    draw();
  </script>
</body>
</html>
